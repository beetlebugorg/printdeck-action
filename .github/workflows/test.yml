name: test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "pyyaml>=6,<7"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/printdeck-curaengine-5.13.0
          key: printdeck-curaengine-5.13.0-linux-x64
      - run: bash curaengine.sh "$HOME/.cache/printdeck-curaengine-5.13.0"
      - name: The tests, with a real slice
        run: |
          export CURAENGINE="$HOME/.cache/printdeck-curaengine-5.13.0/CuraEngine"
          export CURAENGINE_LIB="$HOME/.cache/printdeck-curaengine-5.13.0"
          python3 -m unittest -v test_curaslice test_action

  resin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/printdeck-prusaslicer-2.8.1
          key: printdeck-prusaslicer-2.8.1-linux-x64
      - run: bash prusaslicer.sh "$HOME/.cache/printdeck-prusaslicer-2.8.1"
      - name: The resin tests, with a real slice
        run: |
          export PRUSASLICER="$HOME/.cache/printdeck-prusaslicer-2.8.1/squashfs-root/AppRun"
          export PRINTDECK_ARTIFACTS="$RUNNER_TEMP"
          python3 -m unittest -v test_resinslice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resin-plate
          path: ${{ runner.temp }}/cubes.cbddlp
          if-no-files-found: ignore
          retention-days: 7
